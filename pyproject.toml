[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promise-poc"
version = "0.1.0"
description = "Small rule and ML Promise Engine demonstration"
requires-python = ">=3.13"
dependencies = ["scikit-learn>=1.6,<2", "streamlit>=1.67,<2", "skops>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
